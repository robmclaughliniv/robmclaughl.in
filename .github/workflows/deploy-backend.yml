# .github/workflows/deploy-backend.yml
name: Deploy Backend Infrastructure

on:
  push:
    branches:
      - master # Or your main branch name
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master # Or your main branch name
  delete: # Trigger on any delete event
  workflow_dispatch: # Allows manual triggering

# Permissions needed for OIDC connection to AWS
permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend-preview:
    name: Plan Backend (Preview/PR)
    # Only run this job for pull request events. Plan only: do not apply from a pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js and PNPM
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20' # Match Lambda runtime or desired version
      - name: Setup PNPM
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10 # Match local/required pnpm version
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Lambda Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./lambda_src

      - name: Build Lambda Package
        run: pnpm run package
        working-directory: ./lambda_src

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          # You need to create an IAM role that Terraform can assume
          # and store its ARN in a GitHub secret named TERRAFORM_AWS_IAM_ROLE_ARN.
          # This role needs permissions for:
          # - S3 (terraform state bucket read/write)
          # - DynamoDB (terraform lock table read/write/delete)
          # - Lambda (create/update/delete function, add permissions)
          # - DynamoDB (create/update/delete table)
          # - API Gateway v2 (create/update/delete API, stage, integration, route)
          # - IAM (create/update/delete role, policy, attach policy - for lambda exec role and potentially others)
          # - CloudWatch Logs (create/update log group - for lambda)
          # - CloudFront (distributions, OAC, OAI, functions, response headers policies, tagging)
          # - WAF v2 (web ACLs, tagging)
          # - ACM (certificates, validation, tagging)
          # - Route53 (hosted zones, record sets)
          role-to-assume: ${{ secrets.TERRAFORM_AWS_IAM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }} # Use repo variable or default

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ~1.8 # Use your desired Terraform version constraint

      - name: Terraform Init (Preview)
        id: init-preview
        run: terraform init
        working-directory: ./terraform
        env:
           AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Get Sanitized Branch Name for Workspace
        id: sanitize
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Sanitize branch name (keep alphanumeric, hyphen, truncate) and prefix.
          # HEAD_REF is an environment variable so the branch name is not shell-expanded.
          BRANCH_NAME=$(printf '%s' "$HEAD_REF" | sed 's/[^a-zA-Z0-9-]/-/g' | cut -c1-63)
          WORKSPACE_NAME="preview-${BRANCH_NAME}"
          echo "WORKSPACE_NAME=${WORKSPACE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Sanitized workspace name: ${WORKSPACE_NAME}"

      - name: Terraform Workspace Select or New (Preview)
        id: workspace-preview
        run: |
          terraform workspace select "$WORKSPACE_NAME" || terraform workspace new "$WORKSPACE_NAME"
        working-directory: ./terraform
        env:
          WORKSPACE_NAME: ${{ steps.sanitize.outputs.WORKSPACE_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Terraform Plan (Preview)
        id: plan-preview
        # Save the plan to a file
        run: terraform plan -out=tfplan -no-color
        # Removed continue-on-error as apply depends on successful plan
        # continue-on-error: true
        working-directory: ./terraform
        env:
           AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
           # TF_LOG: DEBUG # Uncomment for debugging Terraform issues

      # Pull requests plan only. Applying from an unreviewed workflow can create or
      # change AWS resources, including IAM, Lambda, and DynamoDB.

      # Optional: Add step here to comment plan output or apply status on the PR
      # using actions like github-script or peter-evans/create-or-update-comment

      # Removed Check Plan Status step as apply would fail if plan failed
      # - name: Check Plan Status
      #  if: steps.plan-preview.outcome == 'failure'
      #  run: exit 1

  deploy-prod:
    name: Deploy Backend (Production)
    # Only run this job for pushes to master or manual triggers
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js and PNPM
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20' # Match Lambda runtime or desired version
      - name: Setup PNPM
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10 # Match local/required pnpm version
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Lambda Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./lambda_src

      - name: Build Lambda Package
        run: pnpm run package
        working-directory: ./lambda_src

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          # Same role assumption as staging, ensure it has prod permissions
          role-to-assume: ${{ secrets.TERRAFORM_AWS_IAM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }} # Use repo variable or default

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ~1.8 # Use your desired Terraform version constraint

      - name: Terraform Init (Production)
        id: init-prod
        run: terraform init
        working-directory: ./terraform
        env:
           AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Terraform Workspace Select (Production)
        id: workspace-prod
        # Assumes 'prod' workspace exists and corresponds to production environment
        run: terraform workspace select prod || terraform workspace new prod
        working-directory: ./terraform
        env:
           AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Terraform Plan (Production)
        id: plan-prod
        run: terraform plan -out=tfplan -no-color
        working-directory: ./terraform
        env:
           AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Terraform Apply (Production)
        id: apply-prod
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform
        env:
           AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }} 

  cleanup-backend-preview:
    name: Cleanup Backend Preview Resources
    # Run only on branch deletes, and ignore deletes of the master branch
    if: >
      github.event_name == 'delete' &&
      github.event.ref_type == 'branch' &&
      github.event.ref != 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No need to build Lambda for destroy

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          # Role needs destroy permissions for all managed resources
          role-to-assume: ${{ secrets.TERRAFORM_AWS_IAM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ~1.8

      - name: Get Sanitized Deleted Branch Name for Workspace
        id: sanitize-deleted
        env:
          DELETED_REF: ${{ github.event.ref }}
        run: |
          # delete events set github.event.ref to the branch name, not refs/heads/<name>
          BRANCH_NAME=$(printf '%s' "$DELETED_REF" | sed 's#refs/heads/##' | sed 's/[^a-zA-Z0-9-]/-/g' | cut -c1-63)
          WORKSPACE_NAME="preview-${BRANCH_NAME}"
          echo "WORKSPACE_NAME=${WORKSPACE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Sanitized workspace name to clean: ${WORKSPACE_NAME}"

      - name: Terraform Init (Cleanup)
        id: init-cleanup
        run: terraform init -no-color
        working-directory: ./terraform
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Terraform Workspace Select (Cleanup)
        id: workspace-cleanup-select
        # Select the workspace corresponding to the deleted branch
        run: terraform workspace select "$WORKSPACE_NAME"
        working-directory: ./terraform
        env:
          WORKSPACE_NAME: ${{ steps.sanitize-deleted.outputs.WORKSPACE_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
        # Fail fast if workspace doesn't exist (implies nothing to destroy)

      - name: Terraform Destroy (Cleanup)
        id: destroy-cleanup
        # Destroy resources in the selected workspace
        run: terraform destroy -auto-approve -no-color
        working-directory: ./terraform
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Terraform Workspace Select Default (Cleanup)
        id: workspace-cleanup-select-default
        # Switch back to default workspace before deleting the preview one
        run: terraform workspace select default
        working-directory: ./terraform
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
        # Always run even if destroy failed, to attempt workspace deletion
        if: always()

      - name: Terraform Workspace Delete (Cleanup)
        id: workspace-cleanup-delete
        # Delete the preview workspace itself
        run: terraform workspace delete "$WORKSPACE_NAME"
        working-directory: ./terraform
        env:
          WORKSPACE_NAME: ${{ steps.sanitize-deleted.outputs.WORKSPACE_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
        # Always run even if destroy failed/workspace select failed, to attempt cleanup
        if: always() 